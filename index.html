<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nursing Student Study Planner</title>
    <style>
        :root {
            --primary-color: #0ea5e9; /* 看護をイメージしたライトブルー */
            --bg-color: #f0f9ff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --danger: #ef4444;
            --accent: #f43f5e; /* 実習などの重要項目用 */
            --category-lecture: #3b82f6;
            --category-practice: #10b981;
            --category-exam: #f59e0b;
            --category-report: #8b5cf6;
        }

        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: white;
            padding: 24px;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            font-size: 1.4rem;
            margin-bottom: 20px;
            text-align: center;
            color: var(--primary-color);
        }

        /* 入力エリア */
        .input-section {
            background: #f8fafc;
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .input-row {
            display: flex;
            gap: 8px;
        }

        input[type="text"], select, input[type="date"] {
            padding: 10px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
        }

        input[type="text"] { flex: 1; }
        select { background: white; cursor: pointer; }

        button#addBtn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
        }

        button#addBtn:active { transform: scale(0.98); }

        /* タスクリスト */
        ul { list-style: none; padding: 0; }

        li {
            display: flex;
            align-items: center;
            padding: 16px;
            border-bottom: 1px solid #f1f5f9;
            gap: 12px;
        }

        li.completed { opacity: 0.6; }
        li.completed .task-text { text-decoration: line-through; }

        .checkbox {
            width: 22px;
            height: 22px;
            cursor: pointer;
            accent-color: var(--primary-color);
        }

        .task-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .task-text { font-weight: 500; }

        .task-meta {
            display: flex;
            gap: 8px;
            align-items: center;
            font-size: 0.75rem;
        }

        .badge {
            padding: 2px 8px;
            border-radius: 4px;
            color: white;
            font-weight: bold;
        }

        .overdue { color: var(--danger); font-weight: bold; }

        .delete-btn {
            background: none;
            border: none;
            color: #cbd5e1;
            cursor: pointer;
            font-size: 1.2rem;
            transition: color 0.2s;
        }

        .delete-btn:hover { color: var(--danger); }

        /* カテゴリーカラー */
        .bg-lecture { background-color: var(--category-lecture); }
        .bg-practice { background-color: var(--category-practice); }
        .bg-exam { background-color: var(--category-exam); }
        .bg-report { background-color: var(--category-report); }
        .bg-other { background-color: var(--text-muted); }

        @media (max-width: 480px) {
            .input-row { flex-direction: column; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🩺 Nursing Study Planner</h1>
    
    <div class="input-section">
        <input type="text" id="taskInput" placeholder="学習・タスク内容を入力...">
        <div class="input-row">
            <select id="categoryInput">
                <option value="講義・予習">講義・予習</option>
                <option value="実習関連">実習関連</option>
                <option value="国試対策">国試対策</option>
                <option value="レポート">レポート</option>
                <option value="その他">その他</option>
            </select>
            <input type="date" id="dateInput">
        </div>
        <button id="addBtn">タスクを追加する</button>
    </div>

    <ul id="taskList"></ul>
</div>

<script>
    const taskInput = document.getElementById('taskInput');
    const categoryInput = document.getElementById('categoryInput');
    const dateInput = document.getElementById('dateInput');
    const addBtn = document.getElementById('addBtn');
    const taskList = document.getElementById('taskList');

    // 初期設定
    dateInput.value = new Date().toISOString().split('T')[0];

    let tasks = JSON.parse(localStorage.getItem('nursing_tasks')) || [];

    const categoryColors = {
        '講義・予習': 'bg-lecture',
        '実習関連': 'bg-practice',
        '国試対策': 'bg-exam',
        'レポート': 'bg-report',
        'その他': 'bg-other'
    };

    function saveTasks() {
        localStorage.setItem('nursing_tasks', JSON.stringify(tasks));
    }

    function renderTasks() {
        taskList.innerHTML = '';
        const today = new Date().toISOString().split('T')[0];

        tasks.forEach((task, index) => {
            const isOverdue = !task.completed && task.date < today;
            const li = document.createElement('li');
            if (task.completed) li.classList.add('completed');

            li.innerHTML = `
                <input type="checkbox" class="checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask(${index})">
                <div class="task-info">
                    <span class="task-text">${task.text}</span>
                    <div class="task-meta">
                        <span class="badge ${categoryColors[task.category]}">${task.category}</span>
                        <span class="${isOverdue ? 'overdue' : ''}">期限: ${task.date || 'なし'} ${isOverdue ? '(!)' : ''}</span>
                    </div>
                </div>
                <button class="delete-btn" onclick="deleteTask(${index})">&times;</button>
            `;
            taskList.appendChild(li);
        });
    }

    function addTask() {
        const text = taskInput.value.trim();
        const category = categoryInput.value;
        const date = dateInput.value;

        if (text === '') return;

        tasks.push({ text, category, date, completed: false });
        taskInput.value = '';
        saveTasks();
        renderTasks();
    }

    window.toggleTask = (index) => {
        tasks[index].completed = !tasks[index].completed;
        saveTasks();
        renderTasks();
    };

    window.deleteTask = (index) => {
        tasks.splice(index, 1);
        saveTasks();
        renderTasks();
    };

    addBtn.addEventListener('click', addTask);
    taskInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') addTask(); });

    renderTasks();
</script>

</body>
</html>
